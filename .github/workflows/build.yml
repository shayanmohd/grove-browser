name: Build desktop apps

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows x64
            os: windows-2022
            platform: win
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate types, behavior, and copy
        run: npm run check
      - name: Compile desktop app
        run: npm run build
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libsecret-1-0
      - name: Smoke test desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Smoke test desktop on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Test Grove skill on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:skill
      - name: Test Grove skill on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:skill
      - name: Package native desktop app
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never -c.extraMetadata.homepage=${{ github.server_url }}/${{ github.repository }}
      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Grove-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
